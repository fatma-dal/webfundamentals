<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebGPU Life</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: monospace;
            color: #eee;
            gap: 16px;
        }
        h1 { font-size: 1.4rem; letter-spacing: 2px; color: #a0c4ff; }
        canvas {
            border: 2px solid #a0c4ff;
            cursor: crosshair;
            image-rendering: pixelated;
        }
        #controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 8px 18px;
            border: 1px solid #a0c4ff;
            background: transparent;
            color: #a0c4ff;
            font-family: monospace;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        button:hover { background: #a0c4ff22; }
        button#playBtn { border-color: #90ee90; color: #90ee90; }
        button#playBtn:hover { background: #90ee9022; }
        label { font-size: 0.85rem; color: #aaa; }
        input[type=range] { width: 100px; accent-color: #a0c4ff; }
        #info { font-size: 0.85rem; color: #aaa; }
    </style>
</head>
<body>
    <h1>GAME OF LIFE</h1>
    <canvas width="512" height="512"></canvas>
    <div id="controls">
        <button id="playBtn">⏸ Pause</button>
        <button id="resetBtn">🔀 Reset</button>
        <button id="clearBtn">🗑 Clear</button>
        <label>Speed: <input type="range" id="speedSlider" min="50" max="1000" step="50" value="200"></label>
        <span id="info">Gen: 0</span>
    </div>

    <script type="module">
        const canvas = document.querySelector("canvas");
        const playBtn = document.getElementById("playBtn");
        const resetBtn = document.getElementById("resetBtn");
        const clearBtn = document.getElementById("clearBtn");
        const speedSlider = document.getElementById("speedSlider");
        const infoEl = document.getElementById("info");

        if (!navigator.gpu) throw new Error("WebGPU not supported on this browser.");
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) throw new Error("No GPU adapter found");
        const device = await adapter.requestDevice();

        const context = canvas.getContext("webgpu");
        const canvasFormat = navigator.gpu.getPreferredCanvasFormat();
        context.configure({ device, format: canvasFormat });

        const GRID_SIZE = 32;
        const WORKGROUP_SIZE = 8;

        // -------------------- VERTICES --------------------
        const vertices = new Float32Array([
            -0.8, -0.8,  0.8, -0.8,  0.8,  0.8,
            -0.8, -0.8,  0.8,  0.8, -0.8,  0.8,
        ]);
        const vertexBuffer = device.createBuffer({
            size: vertices.byteLength,
            usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
        });
        device.queue.writeBuffer(vertexBuffer, 0, vertices);

        const vertexBufferLayout = {
            arrayStride: 8,
            attributes: [{ format: "float32x2", offset: 0, shaderLocation: 0 }],
        };

        // -------------------- UNIFORM --------------------
        const uniformArray = new Float32Array([GRID_SIZE, GRID_SIZE]);
        const uniformBuffer = device.createBuffer({
            size: uniformArray.byteLength,
            usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
        });
        device.queue.writeBuffer(uniformBuffer, 0, uniformArray);

        // -------------------- CELL STATE --------------------
        let cellStateArray = new Uint32Array(GRID_SIZE * GRID_SIZE);

        function randomState() {
            for (let i = 0; i < cellStateArray.length; i++)
                cellStateArray[i] = Math.random() > 0.6 ? 1 : 0;
        }
        randomState();

        const cellStateStorage = [
            device.createBuffer({
                size: cellStateArray.byteLength,
                usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
            }),
            device.createBuffer({
                size: cellStateArray.byteLength,
                usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
            }),
        ];

        function uploadState() {
            device.queue.writeBuffer(cellStateStorage[0], 0, cellStateArray);
            device.queue.writeBuffer(cellStateStorage[1], 0, cellStateArray);
        }
        uploadState();

        // -------------------- SHADERS --------------------
        const cellShaderModule = device.createShaderModule({
            code: `
            @group(0) @binding(0) var<uniform> grid: vec2f;
            @group(0) @binding(1) var<storage> cellState: array<u32>;

            struct VertexOut {
                @builtin(position) pos: vec4f,
                @location(0) cell: vec2f,
            }

            @vertex
            fn vertexMain(@location(0) pos: vec2f,
                        @builtin(instance_index) instance: u32) -> VertexOut {
                let i = f32(instance);
                let cell = vec2f(i % grid.x, floor(i / grid.x));
                let state = f32(cellState[instance]);
                let cellOffset = cell / grid * 2;
                let gridPos = (pos * state + 1) / grid - 1 + cellOffset;
                var out: VertexOut;
                out.pos = vec4f(gridPos, 0, 1);
                out.cell = cell / grid;
                return out;
            }

            @fragment
            fn fragmentMain(in: VertexOut) -> @location(0) vec4f {
                return vec4f(in.cell, 1.0 - in.cell.x, 1.0);
            }
            `
        });

        const simulationShaderModule = device.createShaderModule({
            code: `
            @group(0) @binding(0) var<uniform> grid: vec2f;
            @group(0) @binding(1) var<storage> cellStateIn: array<u32>;
            @group(0) @binding(2) var<storage, read_write> cellStateOut: array<u32>;

            fn cellIndex(cell: vec2u) -> u32 {
                return (cell.y % u32(grid.y)) * u32(grid.x) + (cell.x % u32(grid.x));
            }
            fn cellActive(x: u32, y: u32) -> u32 {
                return cellStateIn[cellIndex(vec2(x, y))];
            }

            @compute @workgroup_size(${WORKGROUP_SIZE}, ${WORKGROUP_SIZE})
            fn computeMain(@builtin(global_invocation_id) cell: vec3u) {
                let activeNeighbors =
                    cellActive(cell.x+1, cell.y+1) + cellActive(cell.x+1, cell.y) +
                    cellActive(cell.x+1, cell.y-1) + cellActive(cell.x,   cell.y-1) +
                    cellActive(cell.x-1, cell.y-1) + cellActive(cell.x-1, cell.y) +
                    cellActive(cell.x-1, cell.y+1) + cellActive(cell.x,   cell.y+1);
                let i = cellIndex(cell.xy);
                switch activeNeighbors {
                    case 2: { cellStateOut[i] = cellStateIn[i]; }
                    case 3: { cellStateOut[i] = 1; }
                    default: { cellStateOut[i] = 0; }
                }
            }
            `
        });

        // -------------------- PIPELINES --------------------
        const bindGroupLayout = device.createBindGroupLayout({
            entries: [
                { binding: 0, visibility: GPUShaderStage.VERTEX | GPUShaderStage.COMPUTE, buffer: {} },
                { binding: 1, visibility: GPUShaderStage.VERTEX | GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
                { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
            ]
        });

        const pipelineLayout = device.createPipelineLayout({ bindGroupLayouts: [bindGroupLayout] });

        const renderPipeline = device.createRenderPipeline({
            layout: pipelineLayout,
            vertex: { module: cellShaderModule, entryPoint: "vertexMain", buffers: [vertexBufferLayout] },
            fragment: { module: cellShaderModule, entryPoint: "fragmentMain", targets: [{ format: canvasFormat }] },
        });

        const simulationPipeline = device.createComputePipeline({
            layout: pipelineLayout,
            compute: { module: simulationShaderModule, entryPoint: "computeMain" },
        });

        const bindGroups = [
            device.createBindGroup({
                layout: bindGroupLayout,
                entries: [
                    { binding: 0, resource: { buffer: uniformBuffer } },
                    { binding: 1, resource: { buffer: cellStateStorage[0] } },
                    { binding: 2, resource: { buffer: cellStateStorage[1] } },
                ]
            }),
            device.createBindGroup({
                layout: bindGroupLayout,
                entries: [
                    { binding: 0, resource: { buffer: uniformBuffer } },
                    { binding: 1, resource: { buffer: cellStateStorage[1] } },
                    { binding: 2, resource: { buffer: cellStateStorage[0] } },
                ]
            }),
        ];

        // -------------------- STATE --------------------
        let step = 0;
        let running = true;
        let intervalId = null;
        let generation = 0;

        function updateGrid() {
            const encoder = device.createCommandEncoder();

            const computePass = encoder.beginComputePass();
            computePass.setPipeline(simulationPipeline);
            computePass.setBindGroup(0, bindGroups[step % 2]);
            computePass.dispatchWorkgroups(
                Math.ceil(GRID_SIZE / WORKGROUP_SIZE),
                Math.ceil(GRID_SIZE / WORKGROUP_SIZE)
            );
            computePass.end();

            step++;
            generation++;
            infoEl.textContent = `Gen: ${generation}`;

            const renderPass = encoder.beginRenderPass({
                colorAttachments: [{
                    view: context.getCurrentTexture().createView(),
                    loadOp: "clear",
                    clearValue: { r: 0.05, g: 0.05, b: 0.15, a: 1 },
                    storeOp: "store",
                }],
            });
            renderPass.setPipeline(renderPipeline);
            renderPass.setBindGroup(0, bindGroups[step % 2]);
            renderPass.setVertexBuffer(0, vertexBuffer);
            renderPass.draw(vertices.length / 2, GRID_SIZE * GRID_SIZE);
            renderPass.end();

            device.queue.submit([encoder.finish()]);
        }

        function renderOnce() {
            // Render current state without advancing simulation
            const encoder = device.createCommandEncoder();
            const renderPass = encoder.beginRenderPass({
                colorAttachments: [{
                    view: context.getCurrentTexture().createView(),
                    loadOp: "clear",
                    clearValue: { r: 0.05, g: 0.05, b: 0.15, a: 1 },
                    storeOp: "store",
                }],
            });
            renderPass.setPipeline(renderPipeline);
            renderPass.setBindGroup(0, bindGroups[step % 2]);
            renderPass.setVertexBuffer(0, vertexBuffer);
            renderPass.draw(vertices.length / 2, GRID_SIZE * GRID_SIZE);
            renderPass.end();
            device.queue.submit([encoder.finish()]);
        }

        function startLoop() {
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(updateGrid, parseInt(speedSlider.value));
        }

        function stopLoop() {
            if (intervalId) { clearInterval(intervalId); intervalId = null; }
        }

        startLoop();

        // -------------------- CONTROLS --------------------
        playBtn.addEventListener("click", () => {
            running = !running;
            if (running) {
                playBtn.textContent = "⏸ Pause";
                startLoop();
            } else {
                playBtn.textContent = "▶ Play";
                stopLoop();
            }
        });

        resetBtn.addEventListener("click", () => {
            randomState();
            uploadState();
            step = 0;
            generation = 0;
            infoEl.textContent = "Gen: 0";
            if (!running) renderOnce();
        });

        clearBtn.addEventListener("click", () => {
            cellStateArray.fill(0);
            uploadState();
            step = 0;
            generation = 0;
            infoEl.textContent = "Gen: 0";
            if (!running) renderOnce();
        });

        speedSlider.addEventListener("input", () => {
            if (running) startLoop();
        });

        // -------------------- CLICK TO TOGGLE CELLS --------------------
        canvas.addEventListener("click", (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor(((e.clientX - rect.left) / rect.width) * GRID_SIZE);
            const y = Math.floor((1 - (e.clientY - rect.top) / rect.height) * GRID_SIZE);
            if (x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) return;

            const idx = y * GRID_SIZE + x;
            cellStateArray[idx] = cellStateArray[idx] ? 0 : 1;
            uploadState();
            if (!running) renderOnce();
        });
    </script>
</body>
</html>
